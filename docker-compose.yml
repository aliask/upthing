services:
  # Deliberately not "app": the webserver is attached to the shared
  # traefik_proxy network, where other stacks' "app" services would shadow
  # this one in DNS resolution.
  upthing-app:
    image: ${IMAGE_REGISTRY:-localhost}/aliask/upthing:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: upthing
      DB_USERNAME: upthing
      DB_PASSWORD: ${DB_PASSWORD}
      APP_DEBUG: "false"
      APP_URL: https://up.willrobertson.id.au
      FORCE_HTTPS: "true"
      TZ: Australia/Melbourne
    volumes:
      - storage:/var/www/storage
    networks:
      - upthing

  webserver:
    image: ${IMAGE_REGISTRY:-localhost}/aliask/upthing-nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: Australia/Melbourne
    depends_on:
      - upthing-app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.upthing.rule=Host(`up.willrobertson.id.au`)"
      - "traefik.http.routers.upthing.tls.certresolver=myresolver"
    networks:
      - proxy
      - upthing

  db:
    image: postgres:12
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: upthing
      POSTGRES_DB: upthing
      TZ: Australia/Melbourne
    networks:
      - upthing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upthing -d upthing"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  storage:

networks:
  upthing:
  proxy:
    name: traefik_proxy
    external: true
